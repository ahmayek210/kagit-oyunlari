<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ortak Köprü — Staging</title><style>body{font:16px system-ui;background:#e9dfca;color:#273335;margin:auto;max-width:900px;padding:1rem}main{background:#fffaf0;padding:1rem;border-radius:12px}button,input{font:inherit;padding:.7rem;margin:.3rem}canvas{width:100%;touch-action:none;border:1px solid #777;background:#fff}#status{min-height:2em}button{cursor:pointer}</style><main><h1>Ortak Köprü</h1><p>İki çizgiyi birleştirerek iki daireyi bağlayın. Kırmızı engele değmeyin.</p><div id="login"><label>Adın <input id="name" maxlength="22"></label><button id="create">Oda aç</button><input id="code" maxlength="6" placeholder="Oda kodu"><button id="join">Katıl</button></div><div id="room" hidden><p>Oda: <strong id="roomcode"></strong></p><p id="players"></p><button id="ready">Hazırım</button><button id="start">Başlat</button><button id="send">Çizimi gönder</button><button id="again">Rövanş</button><canvas id="board" width="860" height="520" aria-label="Köprü çizim alanı"></canvas></div><p id="status" role="status"></p></main><script type="module">
const $=id=>document.getElementById(id), board=$('board'), ctx=board.getContext('2d');
let token=sessionStorage.token||'', code=sessionStorage.code||'', state=null, stroke=[], drawing=false, busy=false;
async function api(path,data={}){const r=await fetch('/'+path,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error);return v;}
async function session(){if(token)return;const result=await api('session',{name:$('name').value});token=result.token;sessionStorage.token=token;}
async function act(fn){try{await fn();$('status').textContent='';}catch(e){$('status').textContent='Hata: '+e.message;}}
function show(v){state=v.state;code=v.code;sessionStorage.code=code;$('login').hidden=true;$('room').hidden=false;$('roomcode').textContent=code;$('players').textContent=state.members.map(m=>m.name+(m.ready?' ✓':'')).join(' · ');$('ready').disabled=state.phase!=='lobby';$('start').disabled=state.phase!=='lobby';$('send').disabled=state.phase!=='playing';$('again').disabled=state.phase!=='finished';$('status').textContent=state.phase==='finished'?'Sonuç: '+(state.round.result.success?'Köprü tamamlandı':state.round.result.reason):state.phase==='playing'?'Çiz ve gönder.':'Oyuncular hazır olunca ev sahibi başlatır.';draw();}
function draw(){ctx.clearRect(0,0,860,520);ctx.fillStyle='#e78b8b';ctx.fillRect(380,260,100,150);ctx.strokeStyle='#3a8';ctx.lineWidth=4;for(const [x,y] of [[120,390],[740,250]]){ctx.beginPath();ctx.arc(x,y,24,0,7);ctx.stroke();}let all=state?.round?Object.values(state.round.submissions):[];for(const s of [...all,stroke]){if(!s.length)continue;ctx.strokeStyle='#375c9b';ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);for(const p of s.slice(1))ctx.lineTo(p.x,p.y);ctx.stroke();}}
function point(e){const r=board.getBoundingClientRect();return{x:Math.max(0,Math.min(860,(e.clientX-r.left)*860/r.width)),y:Math.max(0,Math.min(520,(e.clientY-r.top)*520/r.height))};}
board.onpointerdown=e=>{if(state?.phase!=='playing')return;stroke=[point(e)];drawing=true;board.setPointerCapture(e.pointerId);draw();};board.onpointermove=e=>{if(drawing&&stroke.length<256){const p=point(e),last=stroke.at(-1);if(Math.hypot(p.x-last.x,p.y-last.y)>4)stroke.push(p);draw();}};board.onpointerup=()=>drawing=false;
async function command(type,extra={}){show(await api('command',{code,command:{type,eventId:crypto.randomUUID(),...extra}}));}
$('create').onclick=()=>act(async()=>{await session();show(await api('create'));});$('join').onclick=()=>act(async()=>{await session();show(await api('join',{code:$('code').value}));});$('ready').onclick=()=>act(()=>command('ready',{ready:true}));$('start').onclick=()=>act(()=>command('start'));$('send').onclick=()=>act(()=>command('submit',{stroke}));$('again').onclick=()=>act(async()=>{stroke=[];await command('rematch');});
setInterval(async()=>{if(!token||!code||busy)return;busy=true;try{const v=await api('state',{code});if(state?.phase!==v.state.phase&&v.state.phase==='playing')stroke=[];show(v);}catch(e){$('status').textContent='Bağlantı bekleniyor: '+e.message;}finally{busy=false;}},1000);
</script></html>
